services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nirman
      POSTGRES_PASSWORD: nirman
      POSTGRES_DB: nirman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/test/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirman"]
      interval: 2s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nirman:nirman@db:5432/nirman
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    profiles: ["full"]

volumes:
  pgdata:
