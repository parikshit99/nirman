name: Build 6.x fallback

# Rolling back from 7.x (docs/react-native-plan.md, "Rolling back"): Android won't install an older versionCode, so this
# builds the Capacitor app (apps/mobile) from current main with this run's number and publishes it as the latest
# release. It uses the same packages/core, so it knows every migration and opens the same database file. The Gemini
# key has to be pasted again. Run by hand only (Actions → Build 6.x fallback → Run workflow).
on:
  workflow_dispatch:

jobs:
  fallback:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
      actions: read # to find CI's latest run number
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Set the app version
        run: .github/scripts/app-version.sh
      - name: Number it after the newest 7.x build, so phones accept it as an update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=1" --jq '.workflow_runs[0].run_number')
          echo "VERSION_CODE=$((LAST + 1))" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION-fallback.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "versionCode $((LAST + 1)), version $APP_VERSION-fallback.$GITHUB_RUN_NUMBER"
      - name: Build web bundle
        run: npm run build -w apps/mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - name: Sign the APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: .github/scripts/sign-apk.sh apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk nirman.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish.sh nirman.apk "**Fallback build:** the previous (6.x) app, built from main while a problem in 7.x is fixed. Your data stays; paste your Gemini key again in Settings."
