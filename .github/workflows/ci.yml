name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed 'tools' package, which makes sdkmanager fail.
          packages: platform-tools
      - run: npm ci
      - name: Build web bundle
        run: npm run build -w apps/mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: nirmaan-auditor-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Check no API key is bundled in the app
        run: |
          if unzip -p apps/mobile/android/app/build/outputs/apk/debug/*.apk | grep -a -q -E "AIza[0-9A-Za-z_-]{35}"; then
            echo "The APK contains something that looks like a Google API key"; exit 1
          fi
