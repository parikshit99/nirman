name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # A PR that only changes these doesn't run CI (no APK build). Not CHANGELOG.md: it is built into the app.
    # Pushes to main always run, since every merge publishes.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

# One run per branch or PR at a time. A new push to a PR cancels its older run (saves Actions minutes); on main the
# newer run waits instead, so a publish is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches the Android build itself (.github/scripts/changed-parts.sh). `test` already checks
  # the app's code and bundles it, so a pull request builds the APK only when that changed, or when it has the label
  # `build-apk` (an APK to try on a phone). Never while it is a draft. Pushes to main and manual runs always build.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.parts.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: parts
        run: .github/scripts/changed-parts.sh "${{ github.event.pull_request.base.sha }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Bundle the app (catches import and Metro errors before the APK build)
        run: npm run build

  native:
    # The app (apps/native, React Native): built and signed with the same key as every Nirman build, so it
    # installs as an update over 6.x and every 7.x. This is the APK that is published: arm64 only, the phones it runs on (S25 Ultra).
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft &&
      (needs.changes.outputs.android == 'true' || contains(github.event.pull_request.labels.*.name, 'build-apk'))))
    # On the owner's PC when the repository variable NATIVE_RUNNER is "self-hosted" (docs/self-hosted-runner.md).
    runs-on: ${{ vars.NATIVE_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "linux", "x64", "nirman-pc"]') || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count the changes since the last version bump
      - id: build
        uses: ./.github/actions/build-native
        with:
          # 64-bit ARM only: every phone using the app (a Galaxy S25 Ultra). Add armeabi-v7a for older 32-bit phones.
          architectures: arm64-v8a
          cache-name: arm64
          artifact: nirman-native-apk
          apk: nirman-native.apk
          keystore: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

  publish:
    needs: [test, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the tags and the latest change's message
      - uses: actions/download-artifact@v4
        with:
          name: nirman-native-apk
      - name: Publish as the latest release, and keep the last 5 builds
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.native.outputs.version }}
        run: .github/scripts/publish.sh nirman-native.apk
