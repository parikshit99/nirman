name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Layout check at phone widths (320–412 px)
        run: |
          npm run build
          (cd apps/mobile && npx playwright install --with-deps chromium)
          npm run test:e2e -w apps/mobile

  android:
    # Runs alongside the tests; only publishing waits for both.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count the changes since the last version bump
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle, its downloads and build outputs between runs
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed 'tools' package, which makes sdkmanager fail.
          packages: platform-tools
      - run: npm ci
      - name: Set the app version (major.minor from apps/mobile/package.json, then the number of changes since it was set)
        id: version
        # Feature releases bump major.minor by hand (see CLAUDE.md); every later fix on main counts up the patch:
        # 2.2.0, 2.2.1, 2.2.2 ... and back to .0 at the next bump. Android's versionCode stays the run number.
        run: |
          MAJOR_MINOR=$(node -p "require('./apps/mobile/package.json').version.split('.').slice(0, 2).join('.')")
          BUMPED_AT=$(git log -1 --format=%H -G'"version":' -- apps/mobile/package.json)
          PATCH=$(git rev-list --count "$BUMPED_AT..HEAD")
          echo "APP_VERSION=$MAJOR_MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "version=$MAJOR_MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "Version $MAJOR_MINOR.$PATCH ($PATCH changes since $MAJOR_MINOR was set in ${BUMPED_AT::7})"
      - name: Build web bundle
        run: npm run build -w apps/mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - name: Sign the APK
        # Signed with the release key from the repo secrets, with a rotation record from the old debug key
        # (APK signature v3), so phones that have a debug-signed build still accept this one as an update.
        # Without the secrets (e.g. a pull request from a fork) it is signed with the debug key alone.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          UNSIGNED=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG_KEY=(--ks apps/mobile/android/app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android)
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            RELEASE_KEY=(--ks "$RUNNER_TEMP/release.p12" --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias nirman)
            "$APKSIGNER" rotate --out "$RUNNER_TEMP/lineage" --old-signer "${DEBUG_KEY[@]}" --new-signer "${RELEASE_KEY[@]}"
            "$APKSIGNER" sign --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 --out nirman.apk "${DEBUG_KEY[@]}" --next-signer "${RELEASE_KEY[@]}" "$UNSIGNED"
            rm "$RUNNER_TEMP/release.p12"
          else
            echo "::warning::No release key in the repo secrets; signing with the debug key only"
            "$APKSIGNER" sign --out nirman.apk "${DEBUG_KEY[@]}" "$UNSIGNED"
          fi
      - name: Show the APK signing certificates (the release key must be identical on every build)
        run: |
          "$APKSIGNER" verify --verbose --print-certs nirman.apk | grep -E 'Verified using|certificate DN|SHA-256'
          "$APKSIGNER" lineage --in nirman.apk --print-certs 2>/dev/null | grep -E 'DN|SHA-256' || echo "No key rotation in this APK"
      - uses: actions/upload-artifact@v4
        with:
          name: nirman-apk
          path: nirman.apk
      - name: Check no API key is bundled in the app
        run: |
          if unzip -p nirman.apk | grep -a -q -E "AIza[0-9A-Za-z_-]{35}"; then
            echo "The APK contains something that looks like a Google API key"; exit 1
          fi

  publish:
    needs: [test, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the tags and the latest change's message
      - uses: actions/download-artifact@v4
        with:
          name: nirman-apk
      - name: Publish as the latest release, and keep the last 5 builds
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.android.outputs.version }}
        run: |
          # The fixed tag keeps the download link stable; the version tag records history.
          git tag -f latest
          git tag -f "v$APP_VERSION"
          git push -f origin refs/tags/latest "refs/tags/v$APP_VERSION"
          # Release notes: the newest CHANGELOG section, then this build's details (dates in IST).
          WHATS_NEW=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          NOTES="$WHATS_NEW

          ---
          Version $APP_VERSION, built from main at ${GITHUB_SHA::7} on $(TZ=Asia/Kolkata date +%Y-%m-%d).

          Latest change: $(git log -1 --format=%s)"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Nirman v$APP_VERSION" --notes "$NOTES"
          gh release edit latest --title "Nirman v$APP_VERSION" --notes "$NOTES" --prerelease=false --latest
          gh release upload latest nirman.apk --clobber

          # The same APK under its version, to go back to in an emergency (see the README: back up, uninstall, install, restore).
          cp nirman.apk "nirman-$APP_VERSION.apk"
          gh release view "v$APP_VERSION" >/dev/null 2>&1 || gh release create "v$APP_VERSION" --title "Nirman v$APP_VERSION" --notes "$NOTES" --latest=false
          gh release upload "v$APP_VERSION" "nirman-$APP_VERSION.apk" --clobber
          # Keep the 5 newest version releases; older ones go, but their v… tags stay as history.
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes; done
