name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Layout check at phone widths (320–412 px)
        run: |
          npm run build
          (cd apps/mobile && npx playwright install --with-deps chromium)
          npm run test:e2e -w apps/mobile

  android:
    # Runs alongside the tests; only publishing waits for both.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count the changes since the last version bump
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle, its downloads and build outputs between runs
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed 'tools' package, which makes sdkmanager fail.
          packages: platform-tools
      - run: npm ci
      - name: Set the app version (major.minor from apps/mobile/package.json, then the number of changes since it was set)
        id: version
        # Feature releases bump major.minor by hand (see CLAUDE.md); every later fix on main counts up the patch:
        # 2.2.0, 2.2.1, 2.2.2 ... and back to .0 at the next bump. Android's versionCode stays the run number.
        run: |
          MAJOR_MINOR=$(node -p "require('./apps/mobile/package.json').version.split('.').slice(0, 2).join('.')")
          BUMPED_AT=$(git log -1 --format=%H -G'"version":' -- apps/mobile/package.json)
          PATCH=$(git rev-list --count "$BUMPED_AT..HEAD")
          echo "APP_VERSION=$MAJOR_MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "version=$MAJOR_MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "Version $MAJOR_MINOR.$PATCH ($PATCH changes since $MAJOR_MINOR was set in ${BUMPED_AT::7})"
      - name: Build web bundle
        run: npm run build -w apps/mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - name: Sign the APK (the release key must be identical on every build)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: .github/scripts/sign-apk.sh apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk nirman.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nirman-apk
          path: nirman.apk

  native:
    # The React Native app (apps/native, docs/react-native-plan.md): built and signed like the one above,
    # kept as an artifact for testing. Not published until 7.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count the changes since the last version bump
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17 # React Native's Gradle plugin asks for a Java 17 toolchain
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Set the app version (as in the android job)
        run: |
          MAJOR_MINOR=$(node -p "require('./apps/mobile/package.json').version.split('.').slice(0, 2).join('.')")
          BUMPED_AT=$(git log -1 --format=%H -G'"version":' -- apps/mobile/package.json)
          PATCH=$(git rev-list --count "$BUMPED_AT..HEAD")
          echo "APP_VERSION=$MAJOR_MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "Version $MAJOR_MINOR.$PATCH ($PATCH changes since $MAJOR_MINOR was set in ${BUMPED_AT::7})"
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/native
        env:
          CI: 1
      - name: Build release APK
        # 32-bit x86 left out: no phone uses it, only old emulators.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
        working-directory: apps/native/android
      - name: Sign the APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: .github/scripts/sign-apk.sh apps/native/android/app/build/outputs/apk/release/app-release.apk nirman-native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nirman-native-apk
          path: nirman-native.apk

  publish:
    needs: [test, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the tags and the latest change's message
      - uses: actions/download-artifact@v4
        with:
          name: nirman-apk
      - name: Publish as the latest release, and keep the last 5 builds
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.android.outputs.version }}
        run: |
          # The fixed tag keeps the download link stable; the version tag records history.
          git tag -f latest
          git tag -f "v$APP_VERSION"
          git push -f origin refs/tags/latest "refs/tags/v$APP_VERSION"
          # Release notes: the newest CHANGELOG section, then this build's details (dates in IST).
          WHATS_NEW=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          NOTES="$WHATS_NEW

          ---
          Version $APP_VERSION, built from main at ${GITHUB_SHA::7} on $(TZ=Asia/Kolkata date +%Y-%m-%d).

          Latest change: $(git log -1 --format=%s)"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Nirman v$APP_VERSION" --notes "$NOTES"
          gh release edit latest --title "Nirman v$APP_VERSION" --notes "$NOTES" --prerelease=false --latest
          gh release upload latest nirman.apk --clobber

          # The same APK under its version, to go back to in an emergency (see the README: back up, uninstall, install, restore).
          cp nirman.apk "nirman-$APP_VERSION.apk"
          gh release view "v$APP_VERSION" >/dev/null 2>&1 || gh release create "v$APP_VERSION" --title "Nirman v$APP_VERSION" --notes "$NOTES" --latest=false
          gh release upload "v$APP_VERSION" "nirman-$APP_VERSION.apk" --clobber
          # Keep the 5 newest version releases; older ones go, but their v… tags stay as history.
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes; done
