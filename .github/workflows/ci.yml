name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the latest-debug release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to count the changes since the last version bump
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed 'tools' package, which makes sdkmanager fail.
          packages: platform-tools
      - run: npm ci
      - name: Set the app version (major.minor from apps/mobile/package.json, then the number of changes since it was set)
        # Feature releases bump major.minor by hand (see CLAUDE.md); every later fix on main counts up the patch:
        # 2.2.0, 2.2.1, 2.2.2 ... and back to .0 at the next bump. Android's versionCode stays the run number.
        run: |
          MAJOR_MINOR=$(node -p "require('./apps/mobile/package.json').version.split('.').slice(0, 2).join('.')")
          BUMPED_AT=$(git log -1 --format=%H -G'"version":' -- apps/mobile/package.json)
          PATCH=$(git rev-list --count "$BUMPED_AT..HEAD")
          echo "APP_VERSION=$MAJOR_MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "Version $MAJOR_MINOR.$PATCH ($PATCH changes since $MAJOR_MINOR was set in ${BUMPED_AT::7})"
      - name: Build web bundle
        run: npm run build -w apps/mobile
        env:
          # Crash reporting (Sentry) is switched on by setting the SENTRY_DSN repository variable; blank leaves it off.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      - run: npx cap sync android
        working-directory: apps/mobile
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: nirmaan-auditor-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Show the APK signing certificate (must be identical on every build)
        continue-on-error: true # informational only
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA-256'
      - name: Check no API key is bundled in the app
        run: |
          if unzip -p apps/mobile/android/app/build/outputs/apk/debug/*.apk | grep -a -q -E "AIza[0-9A-Za-z_-]{35}"; then
            echo "The APK contains something that looks like a Google API key"; exit 1
          fi
      - name: Publish as the latest-debug release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk nirmaan-auditor-debug.apk
          # The fixed tag keeps the download link stable; the version tag records history.
          git tag -f latest-debug
          git tag -f "v$APP_VERSION"
          git push -f origin refs/tags/latest-debug "refs/tags/v$APP_VERSION"
          # Release notes: the newest CHANGELOG section, then this build's details (dates in IST).
          WHATS_NEW=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          NOTES="$WHATS_NEW

          ---
          Version $APP_VERSION, built from main at ${GITHUB_SHA::7} on $(TZ=Asia/Kolkata date +%Y-%m-%d).

          Latest change: $(git log -1 --format=%s)"
          gh release view latest-debug >/dev/null 2>&1 || gh release create latest-debug --title "Nirman v$APP_VERSION" --notes "$NOTES"
          gh release edit latest-debug --title "Nirman v$APP_VERSION" --notes "$NOTES" --prerelease=false --latest
          gh release upload latest-debug nirmaan-auditor-debug.apk --clobber
